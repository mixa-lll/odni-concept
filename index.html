/* Прототип: страница сайта во всю ширину, сверху тонкая панель прототипа. Сайт сам по себе светлый — это решение дизайна. */
:root {

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bar-bg: #121712; --bar-fg: #E9EAE4; --bar-muted: #A3A79F; --bar-line: #2A322B; --stage: #0C100C; color-scheme: dark; }
body { background: var(--stage); color: var(--bar-fg); font-family: var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  min-height: 52px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar-bg); border-bottom: 1px solid var(--bar-line); font-size: 14px;
}
.bar .tag { color: var(--bar-muted); white-space: nowrap; }
.bar .tag b { color: var(--bar-fg); font-weight: 600; }
.bar .grow { flex: 1; }
.bar select, .bar button {
  height: 36px; border-radius: 999px; border: 1px solid var(--bar-line); background: var(--bar-bg); color: var(--bar-fg);
  font: inherit; font-size: 14px; padding: 0 14px; cursor: pointer;
}
.bar select { max-width: 260px; }
.bar button[aria-pressed="true"] { background: var(--bar-fg); color: var(--bar-bg); border-color: var(--bar-fg); }
.bar button:focus-visible, .bar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; gap: 4px; }
.seg[hidden] { display: none; }
.stage { display: flex; justify-content: center; padding-block: 0 48px; overflow-x: clip; }
.stage.phone { padding-block: 24px 48px; }
#host { background: #FFFFFF; }
.stage.phone #host { border-radius: 28px; overflow: clip; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
@media (max-width: 500px) { .stage.phone { padding-block: 0 24px; } .stage.phone #host { border-radius: 0; box-shadow: none; } }
.note { text-align: center; color: var(--bar-muted); font-size: 13px; padding: 8px 16px 0; }
@media (max-width: 640px) { .bar .tag { display: none; } .bar select { max-width: 100%; flex: 1; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: auto; } }
/* Просмотр фото: всегда тёмный, как вечер в лесу */
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(12,16,12,.96); color: #E9EAE4; display: grid; grid-template-rows: auto 1fr auto; opacity: 0; pointer-events: none; transition: opacity .25s ease; font-family: var(--ui);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.lb.open { opacity: 1; pointer-events: auto; }
.lb-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; font-size: 14px; color: rgba(233,234,228,.7); }
.lb-stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 64px; touch-action: pan-y; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transform: scale(.96); opacity: 0; transition: transform .35s cubic-bezier(.2,.7,.2,1), opacity .35s ease; user-select: none; }
.lb.open .lb-stage img.ready { transform: none; opacity: 1; }
.lb-cap { text-align: center; padding: 14px 20px 22px; font-size: 15px; color: rgba(233,234,228,.85); min-height: 22px; }
.lb button { width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(233,234,228,.25); background: rgba(18,23,18,.6); color: #E9EAE4; font-size: 22px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s, transform .2s; }
.lb button:hover { background: #F2B45A; border-color: #F2B45A; color: #121712; }
.lb button:active { transform: scale(.94); }
.lb button:focus-visible { outline: 2px solid #F2B45A; outline-offset: 3px; }
.lb-prev, .lb-next { position: absolute; top: 50%; margin-top: -24px; }

.lb-dots { display: flex; gap: 6px; justify-content: center; padding-bottom: 10px; }

.lb-dots i.on { background: #F2B45A; transform: scale(1.3); }
@media (max-width: 640px) { .lb-stage { padding: 0 8px; } .lb-prev, .lb-next { display: none; } }

    var o = document.createElement('option'); o.value = m.tok; o.textContent = m.label; pick.appendChild(o);
  });

  var host = document.getElementById('host');
  var stage = document.getElementById('stage');
  var note = document.getElementById('note');
  var root = host.attachShadow({ mode: 'open' });
  var devseg = document.getElementById('devseg');
  var current = null, variant = 'd', device = 'd', comp = null;

  function lookup(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function interp(str, scope) {
    return str.replace(HOLE, function (_, e) { var v = lookup(scope, e); return v == null ? '' : String(v); });
  }
  function single(str) { var m = str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; }

  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup(scope, single(node.getAttribute('list')) || '') || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { build(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      if (lookup(scope, single(node.getAttribute('value')) || '')) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) continue;
      if (/^on/.test(name)) {
        var fn = lookup(scope, single(val) || '');
        if (typeof fn === 'function') el.addEventListener(name.slice(2), (function (f) { return function (e) { f(e); }; })(fn));
        continue;
      }
      el.setAttribute(name, interp(val, scope));
    }
    node.childNodes.forEach(function (c) { build(c, scope, el); });
    out.appendChild(el);
  }

  function render() {
    var vals = comp.renderVals();
    var tpl = document.getElementById('t-' + current.tok + '_' + variant);
    var frag = document.createDocumentFragment();
    tpl.content.childNodes.forEach(function (c) { build(c, vals, frag); });
    var keep = root.querySelector('style');
    root.textContent = '';
    root.appendChild(keep);
    root.appendChild(frag);
    fx();
  }

  // ---- эффекты после каждой отрисовки ----
  var revealed = new Set(), io = null, firstPaint = true;
  function fx() {
    // фото: рамка для плавного увеличения, увеличение по клику там, где фото не ссылка
    var imgs = root.querySelectorAll('img.ph-img');
    imgs.forEach(function (img, i) {
      var fr = document.createElement('span');
      fr.className = 'fx-frame' + (img.classList.contains('roof') ? ' roof' : '');
      fr.style.cssText = img.getAttribute('style') || '';
      if (!/display\s*:/.test(fr.style.cssText)) fr.style.display = 'block';
      img.setAttribute('style', '');
      img.classList.remove('roof');
      img.parentNode.insertBefore(fr, img);
      fr.appendChild(img);
      if (!img.closest('a')) { fr.classList.add('fx-zoom'); fr.dataset.fxIdx = ''; }
      if (i === 0 && firstPaint && parseInt(fr.style.height, 10) >= 420) fr.classList.add('fx-hero');
    });
    var zoomable = Array.prototype.slice.call(root.querySelectorAll('.fx-zoom'));
    zoomable.forEach(function (fr, i) {
      fr.addEventListener('click', function () { openLb(zoomable, i); });
    });
    root.querySelectorAll('span,a,button').forEach(function (el) {
      if (el.childElementCount === 0 && el.textContent.trim() === 'Все фото' && zoomable.length) {
        el.style.cursor = 'pointer';
        el.addEventListener('click', function (e) { e.preventDefault(); openLb(zoomable, 0); });
      }
    });
    // появление блоков при прокрутке
    var page = root.querySelector('style + div');
    if (!page) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); revealed.add(en.target.dataset.fxRv); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    Array.prototype.forEach.call(page.children, function (el, i) {
      if (i < 3 || el.tagName === 'HEADER' || el.classList.contains('bar')) return;
      el.dataset.fxRv = String(i);
      el.classList.add('fx-rv');
      if (revealed.has(String(i))) el.classList.add('in'); else io.observe(el);
    });
    firstPaint = false;
  }

  // ---- просмотр фото ----
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
  var lbList = [], lbI = 0, lbLast = null;
  function lbShow(i) {
    lbI = (i + lbList.length) % lbList.length;
    var src = lbList[lbI].querySelector('img');
    lbImg.classList.remove('ready');
    lbImg.onload = function () { lbImg.classList.add('ready'); };
    lbImg.src = src.getAttribute('src');
    lbImg.alt = src.alt || '';
    if (lbImg.complete) lbImg.classList.add('ready');
    document.getElementById('lb-cap').textContent = src.alt || '';
    document.getElementById('lb-count').textContent = (lbI + 1) + ' / ' + lbList.length;
    var dots = document.getElementById('lb-dots'); dots.textContent = '';
    lbList.forEach(function (_, k) { var d = document.createElement('i'); if (k === lbI) d.className = 'on'; dots.appendChild(d); });
    var many = lbList.length > 1;
    document.getElementById('lb-prev').hidden = !many;
    document.getElementById('lb-next').hidden = !many;
  }
  function openLb(list, i) {
    lbList = list; lbLast = document.activeElement;
    lbShow(i);
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false');
    document.getElementById('lb-close').focus();
  }
  function closeLb() {
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true');
    if (lbLast && lbLast.focus) lbLast.focus();
  }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', function (e) { e.stopPropagation(); lbShow(lbI - 1); });
  document.getElementById('lb-next').addEventListener('click', function (e) { e.stopPropagation(); lbShow(lbI + 1); });
  document.getElementById('lb-stage').addEventListener('click', function (e) { if (e.target.id === 'lb-stage') closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') lbShow(lbI - 1);
    if (e.key === 'ArrowRight') lbShow(lbI + 1);
  });
  var tx = null;
  lb.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) lbShow(lbI + (dx < 0 ? 1 : -1));
  });

  function setTop() {
    var bar = document.querySelector('.bar');
    var z = parseFloat(host.style.zoom) || 1;
    host.style.setProperty('--fx-top', (bar.getBoundingClientRect().height / z) + 'px');
  }

  // Адаптив: уже 1000 px — всегда телефонная вёрстка во всю ширину; шире — компьютерная,
  // резиновая до 1680 px. «Телефон» на широком экране показывает рамку 390 px.
  var BP = 1000;
  function narrow() { return stage.clientWidth < BP; }
  function want() { return narrow() ? 'm' : device; }

  function fit() {
    var W = stage.clientWidth, w;
    host.style.zoom = 1;
    if (variant === 'm') {
      w = narrow() ? W : 390;
      host.style.setProperty('--km', Math.min(1.3, w / 390).toFixed(4));
    } else {
      w = Math.min(W, 1680);
      host.style.setProperty('--k', Math.min(1, w / 1440).toFixed(4));
    }
    host.dataset.w = variant === 'd' && w < 1200 ? 'md' : 'lg';
    host.style.width = w + 'px';
    stage.classList.toggle('phone', variant === 'm' && !narrow());
    devseg.hidden = narrow();
    document.getElementById('dev-d').setAttribute('aria-pressed', variant === 'd');
    document.getElementById('dev-m').setAttribute('aria-pressed', variant === 'm');
    setTop();
  }

  function show(tok, keepScroll) {
    var m = byTok[tok] || byTok.main;
    if (want() === 'd' && !m.d) m = byTok.main;
    current = m;
    variant = (want() === 'm' && m.m) ? 'm' : 'd';
    var key = m.tok + '_' + variant;
    var Cls = MAKERS[key](Base);
    comp = new Cls({});
    comp._rerender = render;
    root.textContent = '';
    var st = document.createElement('style'); st.textContent = STYLES[key] + '\n' + FX_CSS; root.appendChild(st);
    revealed = new Set(); firstPaint = true;
    render();
    note.hidden = true;
    pick.value = m.tok;
    fit();
    if (!keepScroll) window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + m.tok); } catch (e) {}
  }

  root.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/\.dc\.html$/.test(href)) {
      e.preventDefault();
      var m = byFile[href];
      if (m) show(m.tok);
      return;
    }
    if (href.charAt(0) === '#') {
      e.preventDefault();
      var id = href.slice(1);
      var t = id && root.getElementById(id);
      if (t) t.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
    }
  });

  pick.addEventListener('change', function () { show(pick.value); });
  function setDevice(d) {
    device = d;
    show(current ? current.tok : 'main');
  }
  document.getElementById('dev-d').addEventListener('click', function () { setDevice('d'); });
  document.getElementById('dev-m').addEventListener('click', function () { setDevice('m'); });
  window.addEventListener('resize', function () {
    if (!current) return;
    if (want() !== variant && (want() === 'd' || current.m)) show(current.tok, true); else fit();
  });

  var start = (location.hash || '').slice(1);
  show(byTok[start] ? start : 'main');
})();
</script>
